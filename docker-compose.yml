services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: myschoolboard
      POSTGRES_USER: myschoolboard
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myschoolboard -d myschoolboard"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: myschoolboard_test
      POSTGRES_USER: myschoolboard
      POSTGRES_PASSWORD: local_test_password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myschoolboard -d myschoolboard_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
