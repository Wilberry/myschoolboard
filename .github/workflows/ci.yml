name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myschoolboard_test
          POSTGRES_USER: myschoolboard
          POSTGRES_PASSWORD: local_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U myschoolboard -d myschoolboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://myschoolboard:local_test_password@localhost:5434/myschoolboard_test?schema=public
      TEST_DATABASE_URL: postgresql://myschoolboard:local_test_password@localhost:5434/myschoolboard_test?schema=public
      TEST_DATABASE_DISPOSABLE: "1"
      ALLOW_DEMO_SEED: "1"
      BETTER_AUTH_SECRET: ci-only-secret-value-replace-for-nonproduction-use
      BETTER_AUTH_URL: http://localhost:3000
      DEV_ADMIN_EMAIL: admin@myschoolboard.test
      DEV_ADMIN_PASSWORD: CI-only-demo-password-42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
